name: docs

# Builds the site of libreloaded and libmaszyna (make docs-site, libreloaded's tooling), and
# publishes it on GitHub Pages from main. A pull request only builds it, so a broken page is caught
# before it lands. Pages must be set to "GitHub Actions" as its source for the deploy to apply.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # only for the list of Godot's own classes, which the reference links to Godot's docs: the
      # godot-cpp of libreloaded, the core this plugin is built into
      - name: Check out godot-cpp
        run: |
          git submodule update --init --depth 1 vendor/libreloaded
          git -C vendor/libreloaded submodule update --init --depth 1 godot-cpp

      # libreloaded's site with this repository as its plugin (make docs-site): its guides, this docs/
      # under libmaszyna/ and the class reference of both
      - name: Assemble the site
        run: make docs-site

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: build-docs/site

      - name: Build the site
        working-directory: build-docs/site
        run: bundle exec jekyll build --destination ../../_site --baseurl "/${{ github.event.repository.name }}"
        # Pages serves a project's site under its repository's name, whatever docs/_config.yml says
        env:
          JEKYLL_ENV: production
          # jekyll-github-metadata (part of github-pages) names the repository itself only on
          # GitHub's own Pages builder; here it is told which one this is
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
