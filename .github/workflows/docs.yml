name: docs

# Builds the Jekyll site in docs/ with the class reference generated by scripts/make-api-docs, and
# publishes it on GitHub Pages from main. A pull request only builds it, so a broken page is caught
# before it lands. Pages must be set to "GitHub Actions" as its source for the deploy to apply.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # only for the list of Godot's own classes, which the reference links to Godot's docs
      - name: Check out godot-cpp
        run: git submodule update --init --depth 1 godot-cpp

      - name: Generate the class reference
        run: python3 scripts/make-api-docs docs/api

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs

      - name: Build the site
        working-directory: docs
        run: bundle exec jekyll build --destination ../_site
        env:
          JEKYLL_ENV: production
          # jekyll-github-metadata (part of github-pages) names the repository itself only on
          # GitHub's own Pages builder; here it is told which one this is
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
